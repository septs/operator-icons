name: Bundle operator icons

on:
  workflow_dispatch:
  push:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: write

jobs:
  validate:
    name: Validate operator icons
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate catalogs and icons
        run: .github/validate.py

  bundle:
    name: Bundle operator icons
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Bundle Icons
        run: .github/bundle.py
      - name: Sign Bundle
        run: .github/sign-bundle.sh
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      - name: Upload Bundle
        uses: actions/upload-artifact@v7
        with:
          name: bundle
          path: bundle.zip
          archive: false
      - name: Update Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          files: bundle.zip
