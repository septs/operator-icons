name: Validate operator icons

on:
  pull_request:

jobs:
  validate:
    name: Validate operator icons
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate catalogs and icons
        run: .github/validate.py
